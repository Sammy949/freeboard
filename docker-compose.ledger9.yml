# Local Midnight devnet for freeboard — LEDGER 9 (experimental)
#
# WHY THIS FILE EXISTS
# Compiler 0.34.0 reports `--ledger-version ledger-9.1.0.0-rc.3`, so a contract
# built by it cannot deploy onto the ledger-8 stack in docker-compose.yml (node
# 1.0.0 / indexer 4.3.3 / proof-server 8.1.0). This is the ledger-9 counterpart.
#
# ⚠ UNTESTED BY UPSTREAM. The official support matrix
# (docs.midnight.network/relnotes/support-matrix, read 2026-08-28) has NO
# ledger-9 row — it lists toolchain 0.31.1 / runtime 0.16.0 / Midnight.js 4.1.1
# against the ledger-8 images. Every version below is a pre-release we selected
# ourselves. Keep docker-compose.yml as the known-good ledger-8 fallback.
#
# THE PIN THAT MATTERS: ledger 9.1.0.0-rc.3, held identical across all three of
# the compiler, the SDK, and the node. See the node service comment — a rc.4 node
# rejects rc.3-shaped transactions at submission, and the error names dust, not
# versions.
#
# LOCAL DEVELOPMENT ONLY — do not expose these ports to a public network.
# Ports are offset by +10000 from the ledger-8 stack so both can coexist. They
# should NOT coexist on a 16GB laptop — see the memory note below.
# Up:   docker compose -f docker-compose.ledger9.yml up -d --wait
# Down: docker compose -f docker-compose.ledger9.yml down -v
#
# MEMORY (added 2026-09-01, after this stack hung a WSL2 VM).
# Every service carries a hard cap. Two reasons, and the second is the real one:
#  1. The prover process on the HOST side is the biggest consumer (~5.8GB RSS
#     for the wallet SDK + WASM prover). The containers have to leave room for it.
#  2. Without a cap, a container leak triggers a GLOBAL out-of-memory inside the
#     VM, and the kernel picks the largest process as the victim — which is the
#     prover, mid-proof, not the container that actually misbehaved. A per-service
#     cap keeps the blast radius inside the offending container.
# `memswap_limit` equals `mem_limit` on purpose: that denies these containers
# swap entirely. Docker's default would allow an extra mem_limit of swap, and
# paging to a virtual disk is exactly the behaviour that hangs the whole VM.
# These ceilings are deliberately loose so they never bind on a healthy run;
# tighten them only against measured peaks from `docker stats`.
#
# MEASURED 2026-09-01, one full cycle (up → deploy → healthy check → tampered
# check, ~450 blocks, sampled every 5s):
#   node          224 MiB peak   (15% of its cap)
#   indexer       191 MiB peak   ( 9%)
#   proof-server  112 MiB peak   ( 3%)
#   whole VM      4.9 GiB of 9.9 GiB peak, swap never touched
# The proof server never spiked: this circuit is small enough that proving is
# not the memory event it was assumed to be. The caps are kept as-is anyway,
# because that sample covers well under an hour of chain and the indexer's
# postgres grows with chain length. Revisit after a long-lived session, not
# from this number.
name: freeboard-devnet-l9

services:
  node:
    # ⚠ THE LEDGER PATCH VERSION MATTERS — "ledger 9" is not one thing.
    #
    # 2.0.0-rc.4 pins midnight-ledger 9.1.0.0-rc.3, which is exactly what
    # compiler 0.34.0 targets (`compact --ledger-version`) and what the beta SDK
    # pins (@midnightntwrk/ledger-v9 1.0.0-rc.3).
    #
    # Do NOT "upgrade" to node 2.1.0-beta.1 without moving the SDK too: it pins
    # ledger 9.1.0.0-rc.4 (state encoding v17 → v18, revised cost-model factors,
    # transaction_version 3 → 4). Tried, and it fails at submission with
    # `Invalid Transaction: Custom error: 170` =
    # MalformedError::InvalidDustSpendProof — the wallet builds a dust spend proof
    # under rc.3 rules that an rc.4 node refuses. Everything upstream of
    # submission succeeds, so the failure looks unrelated to versions; it is not.
    image: midnightntwrk/midnight-node:${MIDNIGHT_NODE_IMAGE_TAG:-2.0.0-rc.4}
    container_name: freeboard-l9-node
    mem_limit: 1500m
    memswap_limit: 1500m
    ports:
      - "19944:9944"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    # Healthy means "producing blocks", not just "HTTP up": the probe asks for
    # the hash of block 1 and fails until it exists, because the indexer's SPO
    # component exits 1 if it connects while the chain is still at genesis.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getBlockHash\",\"params\":[1]}' http://localhost:9944 | grep -q '\"result\":\"0x'",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s

  indexer:
    # 4.4.0-rc.2 is the ledger-9/node-2 indexer line. The warning in
    # docker-compose.yml against 4.4.0 tags still stands for the ledger-8 stack;
    # here it is the whole point. Env keys carried over from 4.3.3 (including the
    # dummy Blockfrost id the SPO config loader hard-requires) — if 4.4.x renamed
    # any APP__* key this container is where it will surface.
    image: midnightntwrk/indexer-standalone:4.4.0-rc.2
    container_name: freeboard-l9-indexer
    # No restart policy — see the matching comment in docker-compose.yml. Short
    # version: `depends_on: service_healthy` plus `up --wait` already order this
    # correctly, and a restart policy silently resurrects stale containers when
    # the Docker daemon starts.
    # Bundles its own postgres, so this is the second-largest container.
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "18088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "local-devnet-dummy-id"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    # 9.0.0-rc.6 is the ledger-9 proof server. Note 9.0.0-rc.7 exists ONLY as
    # arch-suffixed tags (-amd64/-arm64) with no multi-arch manifest, so a plain
    # `docker pull ...:9.0.0-rc.7` fails "not found" — rc.6 is the newest
    # pullable tag. Distroless image: the /dev/tcp healthcheck works because
    # CMD-SHELL invokes /bin/sh directly (no curl/wget in the image).
    image: midnightntwrk/proof-server:9.0.0-rc.6
    container_name: freeboard-l9-proof-server
    command: ["midnight-proof-server -v"]
    # Loosest cap of the three: proving is the one operation here that legitimately
    # spikes, and a cap that bites mid-proof would break a working demo to fix a
    # memory problem. 4g bounds a runaway without binding on a real proof.
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "16300:6300"
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6300"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
